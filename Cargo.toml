# Dual-licensed under MIT OR Apache-2.0 — see LICENSE-MIT and LICENSE-APACHE.
#
# `publish` stays false until the first deliberate crates.io release; flip it
# together with that release PR. The crate name `tapes-harnesses` is confirmed
# available on crates.io (checked 2026-07-29), and `tapes-harness` should be
# claimed as a stub redirect at the same time.

# This manifest is the workspace root. Declaring a workspace here is
# load-bearing even beyond the members below: it stops Cargo from walking up and
# adopting whatever workspace happens to own the directory this repo was checked
# out into — a real case, since these crates are vendored into a parent
# repository whose root manifest is an unrelated workspace. Being adopted would
# also silently disable the `[patch.crates-io]` block below, because Cargo only
# honours `patch` at a workspace root, and the libproc pin there is required to
# cross-compile.
#
# `default-members` names every crate, root package included, so a bare
# `cargo test` / `cargo clippy` at the root covers the whole repository. Without
# it Cargo selects only the package owning the root manifest, and a member's
# tests would stop running the moment they were moved into one — silently, and
# looking exactly like a passing run.
[workspace]
members = ["crates/tapes-capture", "cassette-client", "read-contract"]
default-members = [".", "crates/tapes-capture", "cassette-client", "read-contract"]

[package]
name = "tapes-harnesses"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false
authors = ["Paper Compute"]
repository = "https://github.com/papercomputeco/tapes-harnesses"
description = "Shared, open-source client-side harness knowledge for Tapes capture: the harness registry, launch recipes, config patch grammars, plugin artifacts, per-harness session attribution, and transcript discovery."

[lib]
name = "tapes_harnesses"
path = "src/lib.rs"

# Dependency versions match `platform/paper`, which the attribution modules were
# extracted from, so paperd's lockfile does not fork when it consumes this crate.
#
# The envelope's encoders (`base64`, `percent-encoding`) and the peer-PID
# lookup's socket table (`netsock`) are gone from this list: both moved with the
# code that needed them. A dependency that outlives its module is how a crate
# quietly keeps the right to grow that module back.
[dependencies]
arc-swap = "1"
dirs = "5"
http = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# `raw_value` lets the transcript payload embed JSONL records verbatim. The
# ingest server's dedup key is a content hash of the records array, so
# re-serializing through `serde_json::Value` (which reorders map keys) would
# register identical content as a new version on every push.
serde_json = { version = "1", features = ["raw_value"] }
snafu = "0.8"
# The harness-agnostic half of capture: the `X-Tapes-*` envelope producer and
# its harness-id vocabulary, the gateway/nonce protocol, peer-PID lookup, and
# the peer-trust ancestry check. The edge is one-way by construction —
# `tapes-capture` cannot name a harness, so it cannot depend back on this crate,
# and Cargo now enforces what review used to.
tapes-capture = { path = "crates/tapes-capture", version = "0.1.0" }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
# Format-preserving TOML editing for the codex config.toml patch grammar. The
# version matches `platform/paper`'s workspace pin so paperd's lockfile does
# not fork when it swaps its installer onto this crate.
toml_edit = "0.20"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# `test-util` powers `#[tokio::test(start_paused = true)]`, which the
# attribution pipeline's tests rely on: its lanes wait up to 2 s for a
# session file to appear, and a paused clock proves both that a gated caller
# returns immediately and that a timeout path is reached — without any test
# actually sleeping.
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# libproc 0.14.11 gates binding generation on `#[cfg(target_os = "macos")]` in
# its build script. Build-script cfg reflects the HOST, not the target, so
# cross-compiling Linux -> *-apple-darwin runs the empty branch and never writes
# `osx_libproc_bindings.rs` — yet lib.rs, compiled *for* macOS, still
# `include!`s it. Native macOS builds work, which is why this only breaks
# cross-compiling CI.
#
# This rev gates on `CARGO_CFG_TARGET_OS` (the target) and falls back to the
# bindings libproc already ships for docs.rs — no libclang, no SDK headers.
# `platform/paper` and `tapesctl` pin the identical rev for the identical
# reason. Drop all three when a release carries the fix; 0.14.11 is still the
# newest as of this pin. Upstream: andrewdavidmackenzie/libproc-rs#168.
#
# Reached via `netsock -> libproc`.
[patch.crates-io]
libproc = { git = "https://github.com/andrewdavidmackenzie/libproc-rs.git", rev = "9e079f3308182bb3a47fe509571d38fb4fd380f3" }
