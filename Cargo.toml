# Dual-licensed under MIT OR Apache-2.0 — see LICENSE-MIT and LICENSE-APACHE.
#
# This manifest is the workspace root and nothing else: every package in the
# repository lives under `crates/`, so `members` is a glob and no package can
# be added without joining the same selection as the rest. A bare `cargo
# build` / `cargo test` / `cargo clippy` at the root therefore covers the
# whole repository by construction — the previous shape needed a hand-written
# `default-members` list naming each crate, and a crate left out of that list
# silently stopped being tested while still looking like a passing run.
#
# Declaring a workspace here is load-bearing beyond listing members: it stops
# Cargo from walking up and adopting whatever workspace happens to own the
# directory this repo was checked out into — a real case, since these crates
# are vendored into a parent repository whose root manifest is an unrelated
# workspace. Adoption would also silently disable the `[patch.crates-io]`
# block below, because Cargo honours `patch` only at a workspace root. Each
# crate used to buy that protection for itself with an empty `[workspace]`
# table of its own; one real root shields every member at once, and those
# per-crate tables are gone.
[workspace]
members = ["crates/*"]
resolver = "3"

# Fields every crate here agrees on. `rust-version`, `repository`, and
# `description` stay per-crate: they differ, and a crate's MSRV in particular
# is a promise about that crate, not about the repository.
#
# `publish` stays false until the first deliberate crates.io release; flip it
# here, once, together with that release PR.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
authors = ["Paper Compute"]

# Denied outright rather than warned: these three are how a library crate
# turns a caller's recoverable error into a process abort, and every crate
# here is a library someone else's binary links.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# libproc 0.14.11 gates binding generation on `#[cfg(target_os = "macos")]` in
# its build script. Build-script cfg reflects the HOST, not the target, so
# cross-compiling Linux -> *-apple-darwin runs the empty branch and never writes
# `osx_libproc_bindings.rs` — yet lib.rs, compiled *for* macOS, still
# `include!`s it. Native macOS builds work, which is why this only breaks
# cross-compiling CI.
#
# This rev gates on `CARGO_CFG_TARGET_OS` (the target) and falls back to the
# bindings libproc already ships for docs.rs — no libclang, no SDK headers.
# The consumers pin the identical rev for the identical reason. Drop it
# everywhere when a release carries the fix; 0.14.11 is still the newest as of
# this pin. Upstream: andrewdavidmackenzie/libproc-rs#168.
#
# It lives here and nowhere else: Cargo honours `patch` only at a workspace
# root, so a copy in a member manifest would be ignored with no diagnostic.
#
# Reached via `netsock -> libproc`.
[patch.crates-io]
libproc = { git = "https://github.com/andrewdavidmackenzie/libproc-rs.git", rev = "9e079f3308182bb3a47fe509571d38fb4fd380f3" }
