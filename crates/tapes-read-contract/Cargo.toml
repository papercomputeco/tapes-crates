# Dual-licensed under MIT OR Apache-2.0 — see LICENSE-MIT and LICENSE-APACHE
# at the repository root.
#
# `publish` stays false until the first deliberate crates.io release; flip it
# together with that release PR, alongside the sibling crates.

# A member of the repository-root workspace, like every crate here. Membership
# is what puts this crate in the same `cargo test` / `cargo clippy` selection as
# the crates it ships beside — a package outside that selection is covered only
# where somebody remembers to name it, which is how the cassette client once
# went missing from CI entirely.
#
# Being a member changes nothing for consumers: a git pin resolves a package by
# name anywhere in the repository, so this crate is still taken independently of
# its siblings.
[package]
name = "tapes-read-contract"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
publish.workspace = true
authors.workspace = true
repository = "https://github.com/papercomputeco/tapes-crates"
description = "Compatibility shim: the tapes read contract moved into tapes-client. Depend on tapes-client instead."

[lib]
name = "tapes_read_contract"
path = "src/lib.rs"

# Dependency versions match the consumers, so their lockfiles do not fork when
# they consume this crate.
[dependencies]
# Everything this crate publishes now lives there; see src/lib.rs.
tapes-client = { path = "../tapes-client", version = "0.1.0" }

[lints]
workspace = true
