# at the repository root.
#
# `publish` stays false until the first deliberate crates.io release; flip it
# together with that release PR, alongside the sibling crates.

[package]
name = "tapes-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false
authors = ["Paper Compute"]
repository = "https://github.com/papercomputeco/tapes-harnesses"
description = "Harness-agnostic capture primitives: the capture-gateway environment contract and launch-nonce protocol, peer-PID lookup, and the peer-trust ancestry check."

[lib]
name = "tapes_capture"
path = "src/lib.rs"

# Deliberately thin, and it must stay that way: this crate is the half of
# capture that no harness is allowed to reach into. Anything needing `http`,
# `serde`, or a harness id belongs on the other side of the dependency edge.
#
# Versions match the sibling crates so a consumer taking both does not fork its
# lockfile.
[dependencies]
libc = "0.2"
netsock = "0.7"
# `time` only: the async retry path pauses with `tokio::time::sleep` so a caller
# on a runtime is not blocked. Nothing here spawns.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
# `test-util` powers `#[tokio::test(start_paused = true)]`, which the retry
# tests rely on to prove a backoff was paid without any test actually sleeping.
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "test-util",
    "time",
] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
