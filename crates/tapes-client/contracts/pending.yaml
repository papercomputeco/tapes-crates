# Pending additions to the tapes read contract — NOT a vendored document.
#
# `tapes-api.yaml` beside this file is sealed: it is the published release
# asset, byte-for-byte, and nothing here may edit it. This file is the
# opposite kind of thing: a small, hand-written OpenAPI fragment describing
# operations, parameters, and schema properties that tapes has agreed to ship
# but has not yet published in a release this crate can pin.
#
# `src/core/contract.rs` merges it UNDER the vendored document: anything the
# vendored document already carries wins, and only what it lacks is taken
# from here. So the typed methods route through the one operation table and
# the one reducer exactly as every published operation does, and the gates
# (`core::coverage`, `core::models::coverage`) judge the models against the
# merged document.
#
# Every entry here retires itself. `pending_entries_already_published` in
# `src/core/contract.rs` lists each entry the vendored document now carries,
# and a test fails while that list is non-empty — so the re-pin that
# publishes these shapes is the change that deletes them from this file, and
# any disagreement between this guess and the published shape surfaces in
# the same change through the model gate.
paths:
  /v1/sessions/{id}/transcript:
    get:
      description: Returns a session's conversation as transcript rows, one per
        main-thread llm turn side, cursor-paginated. User rows carry the genuine
        user text with harness-injected tags stripped; tool results ride in
        `tool_results`, not `text`.
      operationId: getSessionTranscript
      parameters:
      - description: Session id (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: 'Which rows to return: user, assistant, or all (default all).
          `user` returns only rows with non-empty genuine user text.'
        in: query
        name: role
        schema:
          enum:
          - user
          - assistant
          - all
          type: string
      - description: Case-insensitive substring filter over each row's text
        in: query
        name: q
        schema:
          type: string
      - description: Include subagent threads (default false, root thread only)
        in: query
        name: subagents
        schema:
          type: boolean
      - description: Maximum number of rows in the page (default 200, max 1000)
        in: query
        name: limit
        schema:
          minimum: 1
          type: integer
      - description: Opaque pagination cursor returned as next_cursor by a previous
          page of the same session
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptResponse'
          description: One page of the session's transcript
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid query parameters
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Session not found
      summary: Get a session's transcript
      tags:
      - sessions
  /v1/subjects:
    get:
      description: Returns one row per distinct session auth subject, ordered by
        last_seen_at descending.
      operationId: listSubjects
      parameters:
      - description: Case-insensitive substring filter over the subject id
        in: query
        name: q
        schema:
          type: string
      - description: Maximum number of subjects to return
        in: query
        name: limit
        schema:
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectListResponse'
          description: The matching subjects
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid query parameters
      summary: List subjects
      tags:
      - subjects
components:
  schemas:
    TranscriptResponse:
      description: One page of a session's transcript.
      properties:
        items:
          items:
            $ref: '#/components/schemas/Row'
          type: array
        next_cursor:
          type: string
        session_id:
          type: string
      type: object
    Row:
      description: One side of one main-thread llm turn.
      properties:
        role:
          description: user or assistant
          type: string
        seq:
          type: integer
        span_id:
          type: string
        started_at:
          format: date-time
          type: string
        text:
          type: string
        thread_id:
          description: Empty for the root thread; the subagent thread otherwise.
          type: string
        tool_calls:
          items:
            $ref: '#/components/schemas/ToolCall'
          type: array
        tool_results:
          items:
            $ref: '#/components/schemas/ToolResult'
          type: array
        trace_id:
          type: string
      type: object
    ToolCall:
      properties:
        id:
          type: string
        input: {}
        name:
          type: string
      type: object
    ToolResult:
      properties:
        is_error:
          type: boolean
        text:
          type: string
        tool_use_id:
          type: string
      type: object
    SubjectItem:
      description: One distinct auth subject.
      properties:
        last_seen_at:
          format: date-time
          type: string
        session_count:
          type: integer
        subject:
          type: string
      type: object
    SubjectListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SubjectItem'
          type: array
      type: object
