# Dual-licensed under MIT OR Apache-2.0 — see LICENSE-MIT and LICENSE-APACHE
# at the repository root.
#
# `publish` stays false until the first deliberate crates.io release; flip it
# together with that release PR, alongside the sibling `tapes-harnesses` crate.

# A member of the repository-root workspace, which is what puts it in the same
# `cargo test` and `cargo clippy` selection as the crates it ships beside. It
# once declared an empty `[workspace]` of its own, making it a sibling package
# every gate had to be pointed at by hand — and therefore easy to leave out of
# a gate entirely.
#
# Being a member changes nothing for consumers: a git pin resolves a package by
# name anywhere in the repository, so this crate is still taken independently of
# its siblings.
[package]
name = "tapes-cassette-client"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
publish.workspace = true
authors.workspace = true
repository = "https://github.com/papercomputeco/tapes-harnesses"
description = "Compatibility shim: the tapes cassette client moved into tapes-client. Depend on tapes-client instead."

[lib]
name = "tapes_cassette_client"
path = "src/lib.rs"

# Dependency versions match `tapesctl`, which this machinery was extracted
# from, so the consumer's lockfile does not fork when it consumes this crate.
[dependencies]
# Everything this crate published now lives there; see src/lib.rs. The `cli`
# and `direct-http` features are named explicitly rather than inherited,
# because a consumer of this shim was compiling against a crate that had both
# unconditionally.
tapes-client = { path = "../tapes-client", version = "0.1.0", features = [
  "cli",
  "direct-http",
] }
# The remaining direct dependencies exist only for the retained error enum
# (src/error.rs) and the one URL helper whose arity this crate pins. They go
# when the shim does.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
snafu = "0.8"
url = "2"

[lints]
workspace = true
