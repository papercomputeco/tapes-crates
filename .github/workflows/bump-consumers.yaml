# Open a repin PR in every consumer when this crate's main moves.
#
# These crates exist so the capture clients share one implementation of harness
# knowledge, and that sharing is only real while every consumer pins the same
# revision. Keeping them there was a manual chore — edit each `rev =`, refresh
# the lockfile, open a PR, twice — done about ten times in nine days, and it
# went wrong in the ways manual chores do: one consumer bumped and the other
# forgotten, leaving the two clients running different attribution code with
# every test in both repos green. `scripts/check-pin-parity.sh` reports that
# divergence; this workflow is the half that prevents it.
#
# The bump itself is NOT implemented here. Each consumer owns a
# `make bump-harnesses REV=<sha>` target, and this workflow just calls it, so
# humans and CI run the same command and neither can drift from the other.
#
# Reviewed PRs only. Nothing here merges anything: a bump can carry a breaking
# change to the crates, and whether the consumer is ready is a human call. The
# consumer's own CI runs on the PR and is the gate.
#
# ---------------------------------------------------------------------------
# REQUIRED SECRET: BUMP_FANOUT_TOKEN — not yet provisioned.
#
# The default GITHUB_TOKEN is scoped to this repository alone and cannot check
# out or open a pull request in another one, so cross-repo fan-out needs a token
# of its own. Until that secret exists this workflow deliberately no-ops: the
# guard step below skips the job with a notice rather than failing on every push
# to main.
#
# Provision it as a fine-grained personal access token (or a GitHub App
# installation token) limited to exactly the consumer repositories listed in the
# matrix, with the minimum that a branch-and-PR needs:
#
#   Repository access: only the consumer repositories (NOT this one)
#   Permissions:
#     Contents:      Read and write   (check out, and push the bump branch)
#     Pull requests: Read and write   (open the PR)
#     Metadata:      Read             (implied, granted automatically)
#
# No org, workflow, or packages scope is needed. The token never touches this
# repository, so a leak cannot rewrite the crates themselves.
#
# Inside the job it is handed to the three steps that must have it — the
# consumer checkout, the push, and `gh` — and is never persisted into a
# `.git/config`. One step here runs the consumer's own Makefile, and this token
# can write to every consumer, so a bump target that read it back out of a
# checkout would be able to write to the other consumer too.
#
# One consumer is a private repository today. A public workflow naming it is
# acceptable for now, and worth revisiting when that changes.
# ---------------------------------------------------------------------------

name: Bump consumers

on:
  push:
    branches: [main]
  # Manual runs are how the token gets smoke-tested once it is provisioned, and
  # how a consumer that was skipped or failed gets retried without an empty
  # commit to main.
  workflow_dispatch:

# Read-only for the default token: everything this job writes, it writes to
# another repository through BUMP_FANOUT_TOKEN.
permissions:
  contents: read

# Serialized rather than cancel-in-progress: two pushes in quick succession
# should produce the later revision's PR, and cancelling a half-finished run
# could leave a pushed branch with no PR opened against it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump ${{ matrix.consumer.repo }}
    runs-on: ubuntu-latest
    strategy:
      # One consumer failing must not hide the other's result — the failure
      # mode this whole workflow exists to prevent is exactly "one got bumped
      # and the other did not".
      fail-fast: false
      matrix:
        consumer:
          - repo: papercomputeco/paper
          - repo: papercomputeco/tapesctl

    steps:
      # Secrets cannot be read in a job-level `if:`, so the skip is a step that
      # every later step keys off. This is what makes the workflow dormant
      # instead of a recurring red X on main before the token exists.
      - name: Check the fan-out token is provisioned
        id: guard
        env:
          BUMP_FANOUT_TOKEN: ${{ secrets.BUMP_FANOUT_TOKEN }}
        run: |
          if [[ -z "${BUMP_FANOUT_TOKEN}" ]]; then
            echo "provisioned=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=Bump fan-out skipped::BUMP_FANOUT_TOKEN is not set; see this workflow's header for the scopes it needs."
          else
            echo "provisioned=true" >>"$GITHUB_OUTPUT"
          fi

      # Actions are pinned to full commit SHAs rather than to `@v4` or
      # `@stable`. Those are mutable refs, and this job handles a token that is
      # writable in two repositories that are not this one — so an upstream tag
      # that gets repointed would be reaching a credential with a blast radius
      # larger than anything in the repository that runs it. A SHA cannot be
      # repointed, and upgrading becomes a visible diff.
      #
      # Full history: the PR body quotes the commit range between the revision
      # the consumer pins today and the one being shipped, and a shallow clone
      # cannot resolve the older end of it.
      #
      # `persist-credentials: false` on both checkouts. Nothing in this job
      # needs a credential sitting in a `.git/config`, and one step here runs
      # code this repository does not control (see below), so the tokens are
      # handed to the two steps that actually need them and to nothing else.
      - name: Check out the crates repository
        if: steps.guard.outputs.provisioned == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: crates
          fetch-depth: 0
          persist-credentials: false

      - name: Check out ${{ matrix.consumer.repo }}
        if: steps.guard.outputs.provisioned == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ matrix.consumer.repo }}
          token: ${{ secrets.BUMP_FANOUT_TOKEN }}
          path: consumer
          # The token authenticates this clone and is then discarded rather than
          # written into `consumer/.git/config`. The push step re-supplies it for
          # exactly one command.
          persist-credentials: false

      # The consumers' bump target refreshes Cargo.lock, which needs cargo.
      # Stable rather than each consumer's pinned toolchain: this only resolves
      # dependencies, and the consumer's own CI compiles the result.
      #
      # `@v1` of this action makes `toolchain` a required input; the `stable`
      # branch is the same action with `stable` as its default.
      - name: Install Rust
        if: steps.guard.outputs.provisioned == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      # THE UNTRUSTED STEP. `make bump-harnesses` is the consumer's own
      # Makefile, running whatever that repository's default branch says it
      # runs, plus a dependency resolution that executes third-party build
      # scripts. This repository does not review that code and should not have
      # to: the design is that the consumers own their bump target.
      #
      # What makes that safe is that no credential is reachable from here.
      # BUMP_FANOUT_TOKEN is writable in every consumer, so a single malicious
      # or merely compromised bump target would otherwise be able to read it out
      # of `.git/config` and write to the OTHER consumer — turning one bad
      # repository into two. Hence `persist-credentials: false` above and no
      # token in this step's `env`.
      - name: Run the consumer's bump target
        id: bump
        if: steps.guard.outputs.provisioned == 'true'
        env:
          REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd consumer

          # The revision the consumer pins right now, read before the rewrite so
          # the PR body can describe what is actually changing. Anchored at the
          # start of a line so the manifests' several prose mentions of these
          # crates cannot be mistaken for the pin.
          old_rev="$(
            awk '
              /^tapes-[a-z-]+[[:space:]]*=/ && /papercomputeco\/(tapes-crates|tapes-harnesses)/ {
                if (match($0, /rev[[:space:]]*=[[:space:]]*"[0-9a-fA-F]+"/)) {
                  line = substr($0, RSTART, RLENGTH)
                  match(line, /[0-9a-fA-F]+"$/)
                  print substr(line, RSTART, RLENGTH - 1)
                  exit
                }
              }
            ' Cargo.toml
          )"
          if [[ -z "$old_rev" ]]; then
            echo "::error::could not read the current tapes pin from ${{ matrix.consumer.repo }}'s Cargo.toml"
            exit 1
          fi
          echo "old_rev=$old_rev" >>"$GITHUB_OUTPUT"

          # A failure here is a real signal, not something to swallow: it is how
          # a bump that the consumer cannot absorb — a crate renamed or removed
          # upstream, say — announces that it needs a human, before a PR exists.
          make bump-harnesses REV="$REV"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.consumer.repo }} already pins $REV."
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      # Commit the bump and write the PR text. Still no credential: everything
      # here is local, and the two steps that follow are the only ones that see
      # a token.
      #
      # ONE branch per consumer, reused and force-updated, rather than one per
      # revision.
      #
      # A per-revision name (`...-<short>`) looked like it kept re-runs tidy, and
      # it did — but only for re-runs of the SAME revision. When main moved while
      # a repin PR was still open, the next run produced a second branch, a
      # second PR, and no relationship between them: two independently mergeable
      # PRs against the same pin. Merging them out of order then moves the pin
      # BACKWARD, silently, to a revision the consumer had already left behind —
      # and the result still passes CI, because an older pin is not a broken one.
      # That is precisely the quiet divergence this workflow exists to prevent,
      # reintroduced by the workflow itself.
      #
      # With a stable name there is exactly one repin PR per consumer and it
      # always carries the newest revision, so the failure has nowhere to live:
      # there is never a second PR to merge in the wrong order. The cost is that
      # a review in progress can be force-updated underneath it, which is the
      # right trade — the newest revision is the one worth reviewing, and the PR
      # body is rewritten to describe the new range.
      - name: Commit the bump and describe it
        id: commit
        if: steps.guard.outputs.provisioned == 'true' && steps.bump.outputs.changed == 'true'
        env:
          REV: ${{ github.sha }}
          OLD_REV: ${{ steps.bump.outputs.old_rev }}
        run: |
          set -euo pipefail
          short="${REV:0:7}"
          branch="automation/bump-tapes-crates"
          echo "branch=${branch}" >>"$GITHUB_OUTPUT"
          echo "title=:arrow_up: chore: bump the tapes crates to ${short}" >>"$GITHUB_OUTPUT"

          # What actually changed upstream, which is the whole reason a reviewer
          # can judge this PR at all — without it the diff is four opaque SHAs.
          # `--no-merges` because the range is squash-merged PRs already.
          #
          # `OLD_REV` is the pin on the consumer's default branch, not on the
          # repin branch, so this range stays correct every time the branch is
          # force-updated.
          cd crates
          if git rev-parse --verify --quiet "${OLD_REV}^{commit}" >/dev/null; then
            log="$(git log --oneline --no-merges "${OLD_REV}..${REV}")"
          else
            # The old pin can be unreachable — a force-push, or a consumer
            # pinned to a revision that never landed here. Say so plainly
            # instead of shipping an empty changelog that reads as "no changes".
            log="(cannot show the range: ${OLD_REV} is not reachable in this repository)"
          fi
          cd ..

          cat >"${GITHUB_WORKSPACE}/pr-body.md" <<EOF
          Re-points every tapes crates git dependency at \`${REV}\`.

          Opened automatically by the crates repository's \`bump-consumers\`
          workflow, which runs this repo's own \`make bump-harnesses\` target —
          the same command you would run by hand.

          Both capture clients are meant to pin the same revision, so this PR has
          a sibling in the other consumer. Landing only one of them puts the two
          clients on different harness knowledge while both repos stay green.

          This branch is reused: if main moves again before this lands, the
          branch is force-updated to the newer revision and this description is
          rewritten. There is only ever one open repin PR per consumer, so an
          older one cannot be merged later and drag the pin backward.

          ## Upstream commits (\`${OLD_REV:0:7}..${short}\`)

          \`\`\`
          ${log}
          \`\`\`

          Not auto-merged, and not to be merged on the strength of this
          description: CI on this PR is the gate.
          EOF

          cd consumer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m ":arrow_up: chore: bump the tapes crates to ${short}"

      # The first of two steps that see the token, and the only one that writes
      # git objects. The credential is supplied for the length of one command
      # through `http.extraheader` — it never reaches `.git/config`, so it is
      # gone again the moment this step ends, and it was never present while the
      # consumer's Makefile ran.
      #
      # `--force`, not `--force-with-lease`: the lease would be checked against a
      # remote ref this clone deliberately never fetched, and the branch has a
      # single writer anyway — the workflow's concurrency group serialises runs,
      # and each matrix leg owns a different repository. The branch is automation
      # property; overwriting it with the newest revision is the whole point.
      - name: Push the bump branch
        if: steps.guard.outputs.provisioned == 'true' && steps.bump.outputs.changed == 'true'
        env:
          BUMP_TOKEN: ${{ secrets.BUMP_FANOUT_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          CONSUMER: ${{ matrix.consumer.repo }}
        run: |
          set -euo pipefail
          # The bump target ran consumer-controlled code in the `consumer`
          # checkout, so everything writable there is untrusted at this point:
          # a pre-push hook would run during the push, and a url.insteadOf in
          # .git/config would re-aim the push (and this header) at a host of
          # the consumer's choosing. So the push never touches that repo's
          # config or hooks: clone it bare (a clone writes a fresh config and
          # copies no hooks), then push from the clone to an explicit URL,
          # with hooks pointed at an empty directory for good measure.
          staging="$(mktemp -d)"
          git clone --quiet --bare --no-local consumer "${staging}/push.git"
          auth="$(printf 'x-access-token:%s' "${BUMP_TOKEN}" | base64 -w0)"
          # Masked so a git error that echoes its own arguments cannot print it.
          echo "::add-mask::${auth}"
          mkdir "${staging}/nohooks"
          git -C "${staging}/push.git" \
            -c "core.hooksPath=${staging}/nohooks" \
            -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force "https://github.com/${CONSUMER}.git" \
            "refs/heads/${BRANCH}:refs/heads/${BRANCH}"

      # `gh` gets the token in its own environment and touches no working tree.
      - name: Open or update the repin PR
        if: steps.guard.outputs.provisioned == 'true' && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_FANOUT_TOKEN }}
          CONSUMER: ${{ matrix.consumer.repo }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TITLE: ${{ steps.commit.outputs.title }}
        run: |
          set -euo pipefail
          body="${GITHUB_WORKSPACE}/pr-body.md"

          # The branch is stable, so on every run after the first there is
          # already an open PR to update rather than a second one to open.
          if existing="$(gh pr list --repo "$CONSUMER" --head "$BRANCH" --state open --json number --jq '.[0].number')" &&
             [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$CONSUMER" --title "$TITLE" --body-file "$body"
            echo "::notice::Updated existing PR #${existing} on ${CONSUMER}."
          else
            gh pr create \
              --repo "$CONSUMER" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$body"
          fi

# When these crates move to crates.io the shape survives: a version replaces the
# SHA, and `make bump-harnesses` takes that version instead of a revision.
