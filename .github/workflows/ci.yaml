name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test (${{ matrix.os }})
    strategy:
      matrix:
        # macOS is a real target, not a nicety: the attribution modules are
        # full of #[cfg(target_os = "macos")] code (peer-PID lookup, libproc)
        # that a linux-only matrix would never compile or run.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # `envelope-fixtures` is off by default, so the default run never
      # compiles the corpus reader this crate exposes for consumers to
      # table-test against. Lint and test it too, or it rots unnoticed.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --all-features

  pin-parity:
    name: Consumer pin parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This crate's whole promise is that both capture clients run the same
      # harness knowledge, which is only true while they pin the same revision
      # of it. Neither consumer's CI can assert that alone — it is a fact about
      # the pair — so it is asserted here, from the crate they both pin.
      #
      # Needs a token that can read both consumers' manifests. `GITHUB_TOKEN`
      # is scoped to this repository only, so a private consumer needs
      # `CONSUMER_READ_TOKEN` (a read-only PAT). The script treats an
      # unreadable source as an error rather than a skip, so a missing or
      # under-scoped token shows up as a red job, not as a green one that
      # checked nothing.
      - run: make pin-parity
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_READ_TOKEN || secrets.GITHUB_TOKEN }}
