name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test (${{ matrix.os }})
    strategy:
      matrix:
        # macOS is a real target, not a nicety: the attribution modules are
        # full of #[cfg(target_os = "macos")] code (peer-PID lookup, libproc)
        # that a linux-only matrix would never compile or run.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # `envelope-fixtures` is off by default, so the default run never
      # compiles the corpus reader this crate exposes for consumers to
      # table-test against. Lint and test it too, or it rots unnoticed.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --all-features

