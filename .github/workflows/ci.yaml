name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The vendored read contract is a copy of a published release asset, and a
  # copy nothing checks is a copy that drifts. This gate had no CI caller in
  # either client before the contract moved here; giving it one at the same
  # time is most of why the contract has a single home now — both clients
  # inherit the check through their pin rather than each maintaining one.
  #
  # Its own job, not a step on the matrix: it needs no toolchain and no cache,
  # it is the same answer on every OS, and a failure here should read as
  # "the vendored bytes are wrong", not as a lint failure on ubuntu.
  contract-seal:
    name: Contract seal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Strict is explicit rather than inherited from the runner's CI
      # variable: this job exists to fail when the byte comparison cannot run,
      # and that behaviour should not hinge on a variable someone else sets.
      - run: make contracts-check
        env:
          TAPES_CONTRACT_STRICT: "1"

  # The registry is the source of truth and most coverage derives from it —
  # the matrix iterates REGISTRY, and the recipe table is invariant-tested
  # against it in both directions. What derivation cannot reach is the
  # hand-maintained far side: the version record a run compares itself
  # against, the asset files a bundled extension claims to ship, and the docs
  # table that says the harness exists. A harness missing any of those
  # compiles, passes every unit test, and ships incomplete.
  #
  # Its own job rather than a line in lint-test for the same reason the
  # contract seal is: a failure here should read as "the registry outgrew its
  # record, assets, or docs — and here is the edit", not as one more red test
  # among hundreds. The same tests also run inside the ordinary `cargo test`,
  # which is fine — this job is the named gate, not the only execution.
  #
  # Actions pinned by commit for the same reason harness-matrix.yml pins them:
  # this runs on `pull_request`, so a tag the action's owner can repoint must
  # not decide what executes here. The trailing comment is the release each
  # commit is the tip of.
  registry-completeness:
    name: Registry completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # --nocapture for the same reason the matrix insists on it: the failure
      # list IS the output, and a captured run reports "FAILED" while hiding
      # the edits it is asking for.
      - name: Every registry harness clears the completeness gates
        run: nix develop --command cargo test -p tapes-mock-upstream --test registry_completeness -- --nocapture

  lint-test:
    name: Lint & Test (${{ matrix.os }})
    strategy:
      matrix:
        # macOS is a real target, not a nicety: the attribution modules are
        # full of #[cfg(target_os = "macos")] code (peer-PID lookup, libproc)
        # that a linux-only matrix would never compile or run.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The envelope corpus is vendored, so its DIGEST is checked here the way
      # the read contract's fingerprint is checked in `contract-seal` above.
      # It rides this job rather than getting its own because, unlike that one,
      # it is a cargo test and would otherwise pay for a second toolchain and
      # cache to run a check that finishes instantly. First, so a corpus that
      # drifted fails before the long clippy runs rather than after them, and
      # under its own name so the failure reads as "the vendored bytes are
      # wrong" rather than as one more red test among hundreds.
      - name: Envelope corpus seal
        run: make corpus-seal
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # `envelope-fixtures` is off by default, so the default run never
      # compiles the corpus reader this crate exposes for consumers to
      # table-test against. Lint and test it too, or it rots unnoticed.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --all-features

